name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bringfour_test
          POSTGRES_USER: bringfour
          POSTGRES_PASSWORD: bringfour
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bringfour"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bringfour_test
      DB_USERNAME: bringfour
      DB_PASSWORD: bringfour

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Forzar https en dependencias git
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Instalar dependencias de ingesta
        working-directory: ingest
        run: npm ci --no-audit --no-fund

      - name: Construir Pokemon Showdown
        working-directory: ingest/node_modules/pokemon-showdown
        run: node build

      - name: Regenerar datos y validar esquema de la fuente
        working-directory: ingest
        run: node showdown-data.mjs

      - name: Comprobar que data/ coincide con la fuente fijada
        run: |
          if ! git diff --quiet -- data/; then
            echo "Los JSON de data/ no coinciden con la version fijada de Showdown."
            echo "Ejecuta: node ingest/showdown-data.mjs y commitea el resultado."
            git diff --stat -- data/
            exit 1
          fi

      - name: Instalar dependencias del front
        run: npm ci --no-audit --no-fund

      - name: Comprobar tipos y traducciones
        run: npm run check

      - name: Construir el front
        run: npm run build

      - name: Migrar y sincronizar
        run: |
          php artisan migrate --no-interaction --force
          php artisan data:sync

      - name: Tests
        run: php artisan test
