services:
  db:
    image: postgres:16-alpine
    container_name: turnzero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnzero
      POSTGRES_USER: turnzero
      POSTGRES_PASSWORD: turnzero
    ports:
      - "5434:5432"
    volumes:
      - turnzero-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnzero -d turnzero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turnzero-pgdata:
