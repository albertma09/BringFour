services:
  db:
    image: postgres:16-alpine
    container_name: bringfour-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bringfour
      POSTGRES_USER: bringfour
      POSTGRES_PASSWORD: bringfour
    ports:
      - "5434:5432"
    volumes:
      - bringfour-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bringfour -d bringfour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bringfour-pgdata:
